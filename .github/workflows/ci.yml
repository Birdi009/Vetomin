name: Quality gates
on:
  pull_request:
  push:
    branches-ignore: [master]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PUBLIC_FEATURE_WEBGL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run build
      - run: npm run test:a11y
      - run: npm run test:visual
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-compass-quality-output
          path: |
            test-results
            playwright-report
            .lighthouseci
            dist
          retention-days: 14
