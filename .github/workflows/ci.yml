name: Quality gates
on:
  pull_request:
  push:
    branches-ignore: [master]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: quality (${{ matrix.base }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: /Vetomin/
            name: pages
          - base: /
            name: root
    env:
      PUBLIC_FEATURE_WEBGL: 'false'
      PUBLIC_SITE_URL: https://birdi009.github.io
      PUBLIC_BASE_PATH: ${{ matrix.base }}
      PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run check
      - run: npm run build
      - name: Validate AWS infrastructure
        run: cd infra && npm install && npm run build
      - name: Accessibility, visual checks and complete visitor journeys
        run: npm run test:e2e
      - run: npm run lhci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quiet-compass-quality-${{ matrix.name }}
          include-hidden-files: true
          path: |
            dist
            test-results
            playwright-report
            .quality
            .lighthouseci
            src
            scripts
            tests
            package.json
            package-lock.json
            astro.config.mjs
            playwright.config.ts
            lighthouserc.cjs
          retention-days: 14
